<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Generator</title>
    <style>
        body {
            background: #808080;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px;
        }

        section {
            background: #d3d3d3;
            padding: 25px;
            margin: 15px;
            border-radius: 8px;
            width: 350px;
        }

        input {
            margin: 5px;
            padding: 6px;
        }

        button {
            margin: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        textarea {
            width: 90%;
            resize: vertical;
        }
    </style>
</head>
<body>

    <section>
        <h2>Input</h2>

        <label>X minimum:</label>
        <input type="number" id="xmin" value="0">

        <br>

        <label>X maximum:</label>
        <input type="number" id="xmax" value="100">

        <br>

        <label>Y minimum:</label>
        <input type="number" id="ymin" value="0">

        <br>

        <label>Y maximum:</label>
        <input type="number" id="ymax" value="100">

        <br>

        <label>Number of coordinates:</label>
        <input type="number" id="amount" value="10" min="1">

        <br>

        <label>Decimal places:</label>
        <input type="number" id="decimals" value="2" min="0">

        <br>

        <button onclick="generateCoordinates()">Generate</button>
    </section>

    <section>
        <h2>Output</h2>

        <button onclick="copyCoordinates()">Copy</button>

        <br><br>

        <textarea id="output" rows="20" readonly></textarea>
    </section>

    <script>
        function generateCoordinates() {
            const xmin = Number(document.getElementById("xmin").value);
            const xmax = Number(document.getElementById("xmax").value);
            const ymin = Number(document.getElementById("ymin").value);
            const ymax = Number(document.getElementById("ymax").value);
            const amount = Number(document.getElementById("amount").value);
            const decimals = Number(document.getElementById("decimals").value);

            let output = "";

            for (let i = 0; i < amount; i++) {
                const x = Math.random() * (xmax - xmin) + xmin;
                const y = Math.random() * (ymax - ymin) + ymin;

                output += "(" + x.toFixed(decimals) + ", " + y.toFixed(decimals) + ")\n";
            }

            document.getElementById("output").value = output;
        }

        function copyCoordinates() {
            navigator.clipboard.writeText(document.getElementById("output").value);
        }
    </script>

</body>
</html>
